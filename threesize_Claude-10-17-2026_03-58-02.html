<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3サイズ シミュレーター</title>
<style>
  /* 初期状態は白黒。結果が出ると JS が --accent / --on-accent / --tint を上書きする。 */
  :root {
    --bg: #f4f4f4;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --accent: #1a1a1a;
    --on-accent: #ffffff;
    --tint: 0%;
    --border: #dcdcdc;
    --bar-bg: #e6e6e6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #eeeeee;
      --muted: #9a9a9a;
      --accent: #eeeeee;
      --on-accent: #111111;
      --border: #333333;
      --bar-bg: #333333;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: color-mix(in srgb, var(--accent) var(--tint), var(--bg));
    transition: background .5s;
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 1rem;
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--on-accent);
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  #error { color: var(--accent); min-height: 1.4em; margin: 8px 0 0; font-size: .9rem; }
  .card {
    margin-top: 16px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .card[hidden] { display: none; }
  .verdict {
    text-align: center;
    margin-bottom: 16px;
    padding: 16px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--on-accent);
    transition: background .5s, color .5s;
  }
  .verdict .emoji { font-size: 3rem; line-height: 1.2; }
  .verdict .label { font-size: 2.4rem; font-weight: 800; }
  .verdict .label.long { font-size: 1.7rem; }
  .verdict .reading { font-size: .85rem; min-height: 1.2em; opacity: .8; }
  .verdict .comment { margin: 4px 0 0; }
  .verdict .color { margin-top: 8px; font-size: .8rem; font-family: ui-monospace, monospace; opacity: .8; }
  .size { display: grid; grid-template-columns: 5.5em 1fr 3em; align-items: center; gap: 8px; margin: 6px 0; }
  .size .name { font-size: .9rem; color: var(--muted); }
  .size .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar { height: 12px; background: var(--bar-bg); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  /* バスト=R / ウエスト=G / ヒップ=B の純色 */
  .size:nth-child(1) .bar > span { background: #ff3b30; }
  .size:nth-child(2) .bar > span { background: #2fd158; }
  .size:nth-child(3) .bar > span { background: #3b82ff; }
  h2 { font-size: 1rem; margin: 20px 0 6px; }
  .nearest { display: flex; align-items: center; gap: 12px; }
  .nearest .emoji { font-size: 2.4rem; }
  .nearest .cname { font-size: 1.3rem; font-weight: 800; }
  .nearest .meta, .runner li, footer, .hash { color: var(--muted); font-size: .85rem; }
  .runner { margin: 0; padding-left: 1.2em; }
  .hash { word-break: break-all; font-family: ui-monospace, monospace; }
  footer { margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>3サイズ シミュレーター</h1>
  <p class="lead">名前を入れると、ハッシュ値からバスト・ウエスト・ヒップ(各 0〜999)を算出し、いちばん近いキャラクターと判定を出します。同じ名前なら必ず同じ結果です。測定すると、バストが赤・ウエストが緑・ヒップが青になって、あなたの色に染まります。</p>

  <form id="form" autocomplete="off">
    <input id="name" type="text" placeholder="名前を入力" maxlength="64" aria-label="名前">
    <button type="submit">測定</button>
  </form>
  <p id="error" role="alert"></p>

  <section id="result" class="card" hidden>
    <div class="verdict">
      <div class="emoji" id="v-emoji"></div>
      <div class="label" id="v-label"></div>
      <div class="reading" id="v-reading"></div>
      <p class="comment" id="v-comment"></p>
      <div class="color" id="v-color"></div>
    </div>

    <div id="sizes"></div>

    <h2>いちばん近いキャラクター</h2>
    <div class="nearest">
      <div class="emoji" id="n-emoji"></div>
      <div>
        <div class="cname" id="n-name"></div>
        <div class="meta" id="n-meta"></div>
      </div>
    </div>

    <h2>惜しかった候補</h2>
    <ol class="runner" id="runner"></ol>

    <h2>SHA-256</h2>
    <div class="hash" id="hash"></div>
  </section>

  <footer>ネタです。実在の人物の体型や、キャラクターの公式設定とは一切関係ありません。</footer>
</main>

<script>

// 判定は上から順に評価し、最初に当てはまったものを採用する(レアなものほど上)。
// 3サイズ = [bust, waist, hip]。reading は読み仮名(任意)。
const spread = ([b, w, h]) => Math.max(b, w, h) - Math.min(b, w, h);
const VERDICTS = [
  {

    test: ([b, w, h]) => Math.max(b, w, h) <= 100,

  },

    test: ([b, w, h]) => Math.min(b, w, h) >= 900,
    comments: ["世界が終わります。", "隕石が先に逃げました。", "測定器が悲鳴を上げて壊れました。"],
  },

    label: "ゴジラ", emoji: "🦖",
    test: ([b, w, h]) => Math.min(b, w, h) >= 700,
    comments: ["上陸警報が発令されました。", "東京湾に影が見えます。", "もはや災害です。"],
  },

    label: "糸", reading: "いと", emoji: "🧵",
    test: ([b, w, h]) => Math.max(b, w, h) <= 200,

  },

    label: "のっぺらぼう", emoji: "😶",
    test: (s) => spread(s) <= 50,

  },

    test: ([b, w, h]) => h >= Math.max(b, w) + 600,
    comments: ["夜中に首が伸びる体型です。", "下半身が異様に主張しています。", "障子の向こうに影が伸びています。"],
  },
  {
    label: "鬼", reading: "おに", emoji: "👹",
    test: ([b, w, h]) => b >= Math.max(w, h) + 600,
    comments: ["金棒を持たせたくなる上半身です。", "節分に豆を投げられます。", "胸板が角より目立っています。"],
  },
  {
    label: "獣", reading: "けもの", emoji: "🐗",
    test: (s) => spread(s) >= 800,
    comments: ["バランスという概念がありません。", "野生が3サイズに出ています。", "人類の枠に収まりません。"],
  },
  {
    label: "谷", reading: "たに", emoji: "🏞️",
    test: ([b, w, h]) => w <= 150 && b >= 500 && h >= 500,
    comments: ["ウエストが渓谷になっています。", "深い谷を吹き抜ける風の音がします。", "世界遺産への登録を申請しました。"],
  },
  {
    label: "妖", reading: "あやかし", emoji: "🦊",
    test: ([b, w, h]) => b >= 700 && h >= 700 && w <= 350,
    comments: ["人を惑わす曲線です。", "尻尾が9本ある気がします。", "夜道で振り返ってはいけません。"],
  },
  {
    label: "美", reading: "び", emoji: "✨",
    test: ([b, w, h]) => b >= 500 && h >= 500 && w <= Math.min(b, h) - 200,
    comments: ["黄金比まで秒読みです。", "彫刻家が列を作っています。", "くびれの国宝に認定します。"],
  },
  {

    label: "坂", reading: "さか", emoji: "🛝",

  },
  {
    label: "福", reading: "ふく", emoji: "😄",
    test: ([b, w, h]) => w >= 850 && w >= Math.max(b, h) + 100,
    comments: ["ご利益がありそうです。拝んでいいですか?", "七福神の8人目に推薦します。", "お腹を撫でると運が上がります。"],
  },

  },

    label: "丸", reading: "まる", emoji: "⚪",
    test: (s) => spread(s) <= 120 && Math.min(...s) >= 450,

  },
  {

    test: (s) => spread(s) <= 120,

  },
  {
    label: "鵺", reading: "ぬえ", emoji: "🌀",
    test: ([b, w, h]) => Math.min(b, w, h) >= 250 && Math.max(b, w, h) <= 750 && spread([b, w, h]) >= 200,
    comments: ["正体不明です。頭は猿、胴は狸、尾は蛇。", "何系なのか判定不能です。", "つかみどころのない体型です。"],
  },
  {
    label: "普", reading: "ふつう", emoji: "🙂",
    test: () => true,
    comments: ["ザ・平均点です。", "どこにでもいる安心感があります。", "モブとして最高の逸材です。"],
  },
];

// 名前を正規化し、SHA-256 のバイト列(32 byte)を返す。
async function sha256Bytes(text) {
  if (!(globalThis.crypto && crypto.subtle)) {
    throw new Error("このブラウザでは Web Crypto API が使えません(https か localhost で開いてください)");
  }
  const data = new TextEncoder().encode(text);
  return new Uint8Array(await crypto.subtle.digest("SHA-256", data));
}

const toHex = (bytes) => Array.from(bytes, (x) => x.toString(16).padStart(2, "0")).join("");

// ハッシュの先頭 6 byte を 2 byte ずつ使って 0〜999 に落とす。
function sizesFromHash(bytes) {
  return [0, 2, 4].map((i) => ((bytes[i] << 8) | bytes[i + 1]) % (MAX_SIZE + 1));
}

function ranking(sizes) {
  const dist = (c) => Math.hypot(c[2] - sizes[0], c[3] - sizes[1], c[4] - sizes[2]);
  return CHARACTERS.map((c) => ({ c, d: dist(c) })).sort((a, b) => a.d - b.d);
}

async function analyze(rawName) {
  const name = rawName.normalize("NFKC").trim();
  if (!name) throw new Error("名前を入力してください");
  const bytes = await sha256Bytes(name);
  const sizes = sizesFromHash(bytes);
  const verdict = VERDICTS.find((v) => v.test(sizes));
  // 末尾の byte でコメントを選ぶ(同じ名前なら同じコメント)。
  const comment = verdict.comments[bytes[31] % verdict.comments.length];
  return { name, hash: toHex(bytes), sizes, verdict, comment, ranked: ranking(sizes) };
}

// ---- 表示 ----
const $ = (id) => document.getElementById(id);
const SIZE_LABELS = ["バスト", "ウエスト", "ヒップ"];

// 3サイズ(0〜999)を R/G/B(0〜255)に対応させる。
const toRgb = (sizes) => sizes.map((v) => Math.round((v / MAX_SIZE) * 255));

// WCAG の相対輝度。背景色の上に載せる文字色(黒/白)の選択に使う。
function luminance([r, g, b]) {
  const lin = (c) => {
    const s = c / 255;
    return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
  };
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}

// 黒文字と白文字のうち、コントラスト比が高いほうを返す。
const textColorOn = (rgb) => (luminance(rgb) > 0.179 ? "#111111" : "#ffffff");

// null を渡すと初期の白黒に戻る。
function applyTheme(rgb) {
  const root = document.documentElement.style;
  if (!rgb) {
    ["--accent", "--on-accent", "--tint"].forEach((k) => root.removeProperty(k));
    return;
  }
  root.setProperty("--accent", `rgb(${rgb.join(",")})`);
  root.setProperty("--on-accent", textColorOn(rgb));
  root.setProperty("--tint", "14%");
}

function render(r) {
  $("v-emoji").textContent = r.verdict.emoji;
  $("v-label").textContent = r.verdict.label;
  $("v-label").classList.toggle("long", r.verdict.label.length > 3);
  $("v-reading").textContent = r.verdict.reading ? `(${r.verdict.reading})` : "";
  $("v-comment").textContent = `${r.name}さん、${r.comment}`;

  const rgb = toRgb(r.sizes);
  const hex = "#" + rgb.map((c) => c.toString(16).padStart(2, "0")).join("").toUpperCase();
  $("v-color").textContent = `R${rgb[0]} G${rgb[1]} B${rgb[2]}  ${hex}`;
  applyTheme(rgb);

  $("sizes").replaceChildren(...r.sizes.map((v, i) => {
    const row = document.createElement("div");
    row.className = "size";
    row.innerHTML = '<span class="name"></span><div class="bar"><span></span></div><span class="val"></span>';
    row.querySelector(".name").textContent = SIZE_LABELS[i];
    row.querySelector(".bar > span").style.width = `${(v / MAX_SIZE) * 100}%`;
    row.querySelector(".val").textContent = v;
    return row;
  }));

  const [first, ...rest] = r.ranked;
  const [, , fb, fw, fh] = first.c;
  $("n-emoji").textContent = first.c[1];
  $("n-name").textContent = first.c[0];
  $("n-meta").textContent = `${fb} / ${fw} / ${fh}(距離 ${first.d.toFixed(1)})`;

  $("runner").replaceChildren(...rest.slice(0, 3).map((x) => {
    const li = document.createElement("li");
    li.textContent = `${x.c[1]} ${x.c[0]}(${x.c[2]} / ${x.c[3]} / ${x.c[4]}、距離 ${x.d.toFixed(1)})`;
    return li;
  }));

  $("hash").textContent = r.hash;
  $("result").hidden = false;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").textContent = "";
  try {
    render(await analyze($("name").value));
  } catch (err) {
    $("result").hidden = true;
    applyTheme(null);
    $("error").textContent = err.message;
  }
});
</script>
