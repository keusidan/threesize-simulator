<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3サイズ シミュレーター</title>
<style>
  :root {
    --bg: #fff7fb;
    --card: #ffffff;
    --text: #2b2230;
    --muted: #7d6f86;
    --accent: #e0408f;
    --border: #f0d9e6;
    --bar-bg: #f5e8f0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1620;
      --card: #28202e;
      --text: #f4eaf7;
      --muted: #a898b2;
      --accent: #ff6fb1;
      --border: #3d3245;
      --bar-bg: #3a2f42;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 20px; font-size: .9rem; }
  form { display: flex; gap: 8px; }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 12px 14px;
    font-size: 1rem;
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 10px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }
  button {
    padding: 12px 18px;
    font-size: 1rem;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  #error { color: var(--accent); min-height: 1.4em; margin: 8px 0 0; font-size: .9rem; }
  .card {
    margin-top: 16px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
  }
  .card[hidden] { display: none; }
  .verdict { text-align: center; margin-bottom: 16px; }
  .verdict .emoji { font-size: 3rem; line-height: 1.2; }
  .verdict .label { font-size: 2.4rem; font-weight: 800; color: var(--accent); }
  .verdict .comment { color: var(--muted); margin: 4px 0 0; }
  .size { display: grid; grid-template-columns: 5.5em 1fr 3em; align-items: center; gap: 8px; margin: 6px 0; }
  .size .name { font-size: .9rem; color: var(--muted); }
  .size .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar { height: 12px; background: var(--bar-bg); border-radius: 6px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
  h2 { font-size: 1rem; margin: 20px 0 6px; }
  .nearest { display: flex; align-items: center; gap: 12px; }
  .nearest .emoji { font-size: 2.4rem; }
  .nearest .cname { font-size: 1.3rem; font-weight: 800; }
  .nearest .meta, .runner li, footer, .hash { color: var(--muted); font-size: .85rem; }
  .runner { margin: 0; padding-left: 1.2em; }
  .hash { word-break: break-all; font-family: ui-monospace, monospace; }
  footer { margin-top: 24px; text-align: center; }
</style>
</head>
<body>
<main>
  <h1>📏 3サイズ シミュレーター</h1>
  <p class="lead">名前を入れると、ハッシュ値からバスト・ウエスト・ヒップ(各 0〜999)を算出し、いちばん近いキャラクターと判定を出します。同じ名前なら必ず同じ結果です。</p>

  <form id="form" autocomplete="off">
    <input id="name" type="text" placeholder="名前を入力" maxlength="64" aria-label="名前">
    <button type="submit">測定</button>
  </form>
  <p id="error" role="alert"></p>

  <section id="result" class="card" hidden>
    <div class="verdict">
      <div class="emoji" id="v-emoji"></div>
      <div class="label" id="v-label"></div>
      <p class="comment" id="v-comment"></p>
    </div>

    <div id="sizes"></div>

    <h2>いちばん近いキャラクター</h2>
    <div class="nearest">
      <div class="emoji" id="n-emoji"></div>
      <div>
        <div class="cname" id="n-name"></div>
        <div class="meta" id="n-meta"></div>
      </div>
    </div>

    <h2>惜しかった候補</h2>
    <ol class="runner" id="runner"></ol>

    <h2>SHA-256</h2>
    <div class="hash" id="hash"></div>
  </section>

  <footer>ネタです。実在の人物の体型や、キャラクターの公式設定とは一切関係ありません。</footer>
</main>

<script>
"use strict";

const MAX_SIZE = 999;

// キャラクター表: [名前, emoji, バスト, ウエスト, ヒップ]
// 数値はすべてネタ値。実在作品の公式設定ではない。
const CHARACTERS = [
  // 細
  ["ミジンコ", "🔬", 30, 25, 30],
  ["もやし", "🌱", 90, 70, 80],
  ["鉛筆", "✏️", 60, 60, 60],
  ["一寸法師", "🪡", 120, 100, 120],
  ["こけし", "🪆", 180, 110, 170],
  ["森の妖精", "🧚", 200, 120, 210],
  ["座敷わらし", "👘", 240, 230, 240],
  ["かぐや姫", "🎋", 250, 160, 260],
  ["鶴の恩返し", "🦢", 270, 150, 200],
  ["雪女", "❄️", 290, 180, 280],
  // 美
  ["白雪姫", "🍎", 650, 380, 680],
  ["シンデレラ", "👠", 640, 360, 660],
  ["人魚", "🧜", 680, 350, 650],
  ["小野小町", "🌸", 690, 410, 700],
  ["弁財天", "🎶", 700, 400, 720],
  ["楊貴妃", "🍑", 710, 450, 730],
  ["ミロのヴィーナス", "🏛️", 720, 430, 740],
  ["ギリシャの壺", "🏺", 740, 300, 760],
  ["天女", "🪽", 750, 420, 770],
  ["ひょうたん", "🍶", 780, 350, 800],
  ["九尾の狐", "🦊", 800, 380, 780],
  ["砂時計", "⏳", 800, 200, 800],
  ["ヴァルキリー", "🛡️", 820, 500, 830],
  // 普
  ["食パン", "🍞", 400, 400, 400],
  ["豆腐", "🧈", 450, 450, 450],
  ["浦島太郎", "🐢", 480, 470, 490],
  ["忍者", "🥷", 480, 400, 470],
  ["花咲か爺さん", "🌼", 500, 520, 480],
  ["村人A", "🧑", 500, 500, 500],
  ["桃太郎", "🍑", 520, 480, 500],
  ["侍", "⚔️", 540, 500, 520],
  ["金太郎", "🪓", 560, 520, 540],
  ["招き猫", "🐱", 600, 560, 580],
  // 太
  ["大福", "🍡", 500, 750, 500],
  ["太鼓", "🥁", 500, 750, 500],
  ["雪だるま", "⛄", 500, 700, 500],
  ["樽", "🛢️", 620, 700, 620],
  ["福助", "🎎", 600, 800, 640],
  ["鏡餅", "🍘", 600, 780, 600],
  ["だるま", "🔴", 650, 830, 600],
  ["布袋様", "😄", 680, 900, 700],
  ["肉まん", "🥟", 700, 900, 700],
  ["たぬきの置物", "🦝", 620, 860, 640],
  ["ずんぐり熊", "🐻", 750, 850, 720],
  // 獣
  ["ろくろ首", "🧣", 150, 100, 950],
  ["大蛇", "🐍", 100, 900, 100],
  ["烏天狗", "🪶", 900, 150, 200],
  ["牛鬼", "🐂", 900, 700, 100],
  ["ゴリラ", "🦍", 950, 500, 300],
  ["鳳凰", "🔥", 950, 100, 500],
  ["ケンタウロス", "🐎", 850, 450, 980],
  ["河童", "🥒", 300, 750, 100],
  // ゴジラ級
  ["大仏", "🗿", 850, 800, 900],
  ["象", "🐘", 870, 920, 880],
  ["ティラノサウルス", "🦖", 900, 850, 920],
  ["白鯨", "🐋", 930, 950, 940],
  ["ドラゴン", "🐉", 940, 860, 900],
  ["巨大怪獣", "🦖", 950, 950, 950],
  ["ダイダラボッチ", "⛰️", 980, 920, 990],
  ["富士山", "🗻", 990, 990, 990],
  ["地球", "🌍", 999, 999, 999],
];

// 判定は上から順に評価し、最初に当てはまったものを採用する。
// 3サイズ = [bust, waist, hip]
const VERDICTS = [
  {
    key: "godzilla", label: "ゴジラ", emoji: "🦖",
    test: ([b, w, h]) => Math.min(b, w, h) >= 700,
    comments: ["上陸警報が発令されました。", "東京湾に影が見えます。", "もはや災害です。"],
  },
  {
    key: "slim", label: "細", emoji: "🪡",
    test: ([b, w, h]) => Math.max(b, w, h) <= 300,
    comments: ["風が吹いたら飛びそうです。", "細いというより、もう線です。", "ちゃんと食べてください。"],
  },
  {
    key: "beast", label: "獣", emoji: "🐗",
    test: ([b, w, h]) => Math.max(b, w, h) - Math.min(b, w, h) >= 800,
    comments: ["バランスという概念がありません。", "野生が3サイズに出ています。", "人類の枠に収まりません。"],
  },
  {
    key: "beauty", label: "美", emoji: "✨",
    test: ([b, w, h]) => b >= 500 && h >= 500 && w <= Math.min(b, h) - 200,
    comments: ["黄金比まで秒読みです。", "彫刻家が列を作っています。", "くびれの国宝に認定します。"],
  },
  {
    key: "plump", label: "太", emoji: "🍙",
    test: ([b, w, h]) => w >= 600 && w >= Math.max(b, h) + 50,
    comments: ["福の神が宿っています。", "ウエストが主役です。", "ご飯がおいしい季節ですね。"],
  },
  {
    key: "normal", label: "普", emoji: "🙂",
    test: () => true,
    comments: ["ザ・平均点です。", "どこにでもいる安心感があります。", "モブとして最高の逸材です。"],
  },
];

// 名前を正規化し、SHA-256 のバイト列(32 byte)を返す。
async function sha256Bytes(text) {
  if (!(globalThis.crypto && crypto.subtle)) {
    throw new Error("このブラウザでは Web Crypto API が使えません(https か localhost で開いてください)");
  }
  const data = new TextEncoder().encode(text);
  return new Uint8Array(await crypto.subtle.digest("SHA-256", data));
}

const toHex = (bytes) => Array.from(bytes, (x) => x.toString(16).padStart(2, "0")).join("");

// ハッシュの先頭 6 byte を 2 byte ずつ使って 0〜999 に落とす。
function sizesFromHash(bytes) {
  return [0, 2, 4].map((i) => ((bytes[i] << 8) | bytes[i + 1]) % (MAX_SIZE + 1));
}

function ranking(sizes) {
  const dist = (c) => Math.hypot(c[2] - sizes[0], c[3] - sizes[1], c[4] - sizes[2]);
  return CHARACTERS.map((c) => ({ c, d: dist(c) })).sort((a, b) => a.d - b.d);
}

async function analyze(rawName) {
  const name = rawName.normalize("NFKC").trim();
  if (!name) throw new Error("名前を入力してください");
  const bytes = await sha256Bytes(name);
  const sizes = sizesFromHash(bytes);
  const verdict = VERDICTS.find((v) => v.test(sizes));
  // 末尾の byte でコメントを選ぶ(同じ名前なら同じコメント)。
  const comment = verdict.comments[bytes[31] % verdict.comments.length];
  return { name, hash: toHex(bytes), sizes, verdict, comment, ranked: ranking(sizes) };
}

// ---- 表示 ----
const $ = (id) => document.getElementById(id);
const SIZE_LABELS = ["バスト", "ウエスト", "ヒップ"];

function render(r) {
  $("v-emoji").textContent = r.verdict.emoji;
  $("v-label").textContent = r.verdict.label;
  $("v-comment").textContent = `${r.name}さん、${r.comment}`;

  $("sizes").replaceChildren(...r.sizes.map((v, i) => {
    const row = document.createElement("div");
    row.className = "size";
    row.innerHTML = '<span class="name"></span><div class="bar"><span></span></div><span class="val"></span>';
    row.querySelector(".name").textContent = SIZE_LABELS[i];
    row.querySelector(".bar > span").style.width = `${(v / MAX_SIZE) * 100}%`;
    row.querySelector(".val").textContent = v;
    return row;
  }));

  const [first, ...rest] = r.ranked;
  const [, , fb, fw, fh] = first.c;
  $("n-emoji").textContent = first.c[1];
  $("n-name").textContent = first.c[0];
  $("n-meta").textContent = `${fb} / ${fw} / ${fh}(距離 ${first.d.toFixed(1)})`;

  $("runner").replaceChildren(...rest.slice(0, 3).map((x) => {
    const li = document.createElement("li");
    li.textContent = `${x.c[1]} ${x.c[0]}(${x.c[2]} / ${x.c[3]} / ${x.c[4]}、距離 ${x.d.toFixed(1)})`;
    return li;
  }));

  $("hash").textContent = r.hash;
  $("result").hidden = false;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").textContent = "";
  try {
    render(await analyze($("name").value));
  } catch (err) {
    $("result").hidden = true;
    $("error").textContent = err.message;
  }
});
</script>
</body>
</html>
