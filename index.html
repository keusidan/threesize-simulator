    --tint: 0%;

  @media (prefers-color-scheme: dark) {

      --muted: #9a9a9a;
      --accent: #eeeeee;
      --on-accent: #111111;
      --border: #333333;
      --bar-bg: #333333;
    }

    background: var(--rainbow) 0 0 / 1200px 100%;
    color: #111;
    animation: rainbow-flow 8s linear infinite;
  }
  html.rainbow body {
    background:
      linear-gradient(color-mix(in srgb, var(--bg) 78%, transparent), color-mix(in srgb, var(--bg) 78%, transparent)),
      var(--rainbow) 0 0 / 1200px 100%;
    animation: rainbow-flow-body 8s linear infinite;
  }
  @keyframes rainbow-flow { to { background-position: 1200px 0; } }
  @keyframes rainbow-flow-body { to { background-position: 0 0, 1200px 0; } }
  @media (prefers-reduced-motion: reduce) {
    html.rainbow .verdict, html.rainbow form button, html.rainbow body { animation: none; }
  }
  * { box-sizing: border-box; }
  body {

  .share-status { flex-basis: 100%; min-height: 1.2em; margin: 0; font-size: .85rem; color: var(--muted); text-align: center; }
  footer { margin-top: 24px; text-align: center; }
  footer a { color: inherit; }

<body>
<main>
  <h1>3サイズ シミュレーター</h1>
  <p class="lead">あなたの3サイズはいくつ？</p>

  <form id="form" autocomplete="off">
    <input id="name" type="text" placeholder="名前を入力" maxlength="64" aria-label="名前">
    <button type="submit">測定</button>
  </form>
  <p id="error" role="alert"></p>

  <section id="result" class="card" hidden>
    <div class="verdict">
      <div class="emoji" id="v-emoji"></div>
      <div class="label" id="v-label"></div>
      <div class="reading" id="v-reading"></div>
      <div class="color" id="v-color"></div>
    </div>

    <div class="share">
      <button type="button" class="btn" id="share-native" hidden>共有</button>
      <a class="btn" id="share-x" target="_blank" rel="noopener noreferrer">X で共有</a>
      <a class="btn" id="share-line" target="_blank" rel="noopener noreferrer">LINE で共有</a>
      <button type="button" class="btn" id="share-copy">結果をコピー</button>
      <p class="share-status" id="share-status" role="status"></p>
    </div>

    <div id="sizes"></div>

    <h2>いちばん近いキャラクター</h2>
    <div class="nearest">
      <div class="emoji" id="n-emoji"></div>
      <div>
        <div class="cname" id="n-name"></div>
        <div class="meta" id="n-meta"></div>
      </div>
    </div>

    <h2>惜しかった候補</h2>
    <ol class="runner" id="runner"></ol>

    <div id="hash-box">
      <h2>SHA-256</h2>
      <div class="hash" id="hash"></div>
    </div>
  </section>

  <footer>
    ネタです。実在の人物の体型や、キャラクターの公式設定とは一切関係ありません。<br>
    書体: Google Fonts(SIL Open Font License 1.1)。<a href="fonts/FONT-LICENSES_+process.argv[1]+.txt">ライセンス全文</a>
  </footer>
</main>

  ],
  vee: [
    ["武", "ぶ", "💪", "Reggae One"], ["鬼", "おに", "👹", "Dela Gothic One"],
    ["天狗", "てんぐ", "👺", "Yuji Syuku"], ["牛鬼", "うしおに", "🐂", "Kaisei Tokumin"],
    ["阿修羅", "あしゅら", "🔱", "Zen Antique"],
  ],
  beast: [
    ["獣", "けもの", "🐗", "Yusei Magic"], ["河童", "かっぱ", "🥒", "Hachi Maru Pop"],
    ["ろくろ首", "ろくろくび", "🧣", "Zen Kurenaido"], ["キメラ", "", "🦁", "DotGothic16"],
    ["ヤマタノオロチ", "", "🐍", "Train One"],
  ],
};

// 体型は比率だけで決める(大きさには依存しない)。
function shapeOf([b, w, h]) {
  const hi = Math.max(b, w, h);
  const lo = Math.min(b, w, h);
  const bh = Math.min(b, h);
  if (lo <= hi * 0.1) return "beast";
  if (hi <= lo * 1.25) return "even";
  if (w <= bh * 0.8 && Math.max(b, h) <= bh * 1.3) return "hour";
  if (w >= Math.max(b, h) * 1.15) return "barrel";
  if (h >= b * 1.4 && h >= w) return "pear";
  if (b >= h * 1.4 && b >= w) return "vee";
  return "plain";
}

// 人間サイズ(大きさの段階 0)だけは、体型の表引きより先にここを上から順に評価して細かく分ける。
// 基準は 20 代前半の平均(82 / 64 / 89)。この理想サイズちょうどは、どれにも当てはまらず表の「美」に落ちる。
const waistRatio = ([b, w, h]) => w / Math.min(b, h);          // ウエスト ÷ 小さいほうの(バスト, ヒップ)
const hipBustGap = ([b, , h]) => Math.max(b, h) / Math.min(b, h); // バストとヒップの差(比)
const isCurvy = (s) => waistRatio(s) <= 0.8 && hipBustGap(s) <= 1.3; // くびれ型

const HUMAN_VERDICTS = [
  { label: "童", reading: "わらべ", emoji: "🧒", font: "Hachi Maru Pop", test: (s) => Math.max(...s) <= 60 },
  { label: "細", reading: "ほそ", emoji: "🪡", font: "Zen Kurenaido", test: ([b, w, h]) => b <= 75 && w <= 55 && h <= 80 },
  { label: "艶", reading: "つや", emoji: "💋", font: "Yuji Mai", test: (s) => waistRatio(s) <= 0.65 && hipBustGap(s) <= 1.3 && Math.min(s[0], s[2]) >= 80 },
  { label: "華", reading: "はな", emoji: "🌺", font: "Kaisei Decol", test: (s) => isCurvy(s) && Math.min(s[0], s[2]) >= 95 },
  { label: "凛", reading: "りん", emoji: "🎐", font: "Shippori Mincho B1", test: (s) => isCurvy(s) && Math.max(s[0], s[2]) <= 80 },
  { label: "若", reading: "わか", emoji: "🌱", font: "Kiwi Maru", test: ([b, w, h]) => b <= 80 && w <= 62 && h <= 86 },
  { label: "壺", reading: "つぼ", emoji: "🏺", font: "Zen Old Mincho", test: ([b, w, h]) => h >= b * 1.3 && h < b * 1.6 && w <= h * 0.7 },
  { label: "桃", reading: "もも", emoji: "🍑", font: "Mochiy Pop One", test: ([b, w, h]) => h >= b * 1.15 && h < b * 1.4 && w <= h * 0.85 },
  { label: "瓜", reading: "うり", emoji: "🍈", font: "Yusei Magic", test: ([b, w, h]) => b >= h * 1.15 && b < h * 1.4 && w <= b * 0.85 },
  { label: "竹", reading: "たけ", emoji: "🎋", font: "Yuji Boku", test: (s) => shapeOf(s) === "even" && s[0] + s[1] + s[2] >= 240 && s[0] + s[1] + s[2] < 300 },
  { label: "丸", reading: "まる", emoji: "🟠", font: "Potta One", test: (s) => shapeOf(s) === "even" && s[0] + s[1] + s[2] >= 300 },
];

// 判定の番号(共有ページ名 r/<番号>.html)。表は 体型の並び順 × 段階 で 0〜34、人間サイズの判定はその続きの 35〜45。
const TIER_COUNT = TIER_LIMITS.length + 1;
const TABLE_SIZE = Object.keys(VERDICT_TABLE).length * TIER_COUNT;

function judge(sizes) {
  const shape = shapeOf(sizes);
  const avg = (sizes[0] + sizes[1] + sizes[2]) / 3;
  // 極端型は最小値が平均を引き下げて最上位に届かなくなるので、最大値を混ぜて大きさを見る。
  const size = shape === "beast" ? (Math.max(...sizes) + avg) / 2 : avg;
  const tier = TIER_LIMITS.filter((limit) => size >= limit).length;
  if (tier === 0) {
    const human = HUMAN_VERDICTS.find((v) => v.test(sizes));
    if (human) return { id: TABLE_SIZE + HUMAN_VERDICTS.indexOf(human), label: human.label, reading: human.reading, emoji: human.emoji, font: human.font };
  }
  const [label, reading, emoji, font] = VERDICT_TABLE[shape][tier];
  return { id: Object.keys(VERDICT_TABLE).indexOf(shape) * TIER_COUNT + tier, label, reading, emoji, font };
}

// 名前を正規化し、SHA-256 のバイト列(32 byte)を返す。
async function sha256Bytes(text) {
  if (!(globalThis.crypto && crypto.subtle)) {
    throw new Error("このブラウザでは Web Crypto API が使えません(https か localhost で開いてください)");
  }
  const data = new TextEncoder().encode(text);
  return new Uint8Array(await crypto.subtle.digest("SHA-256", data));
}

const toHex = (bytes) => Array.from(bytes, (x) => x.toString(16).padStart(2, "0")).join("");

// ハッシュの先頭 6 byte を 2 byte ずつ使って 0〜999 に落とす。
function sizesFromHash(bytes) {
  return [0, 2, 4].map((i) => ((bytes[i] << 8) | bytes[i + 1]) % (MAX_SIZE + 1));
}

function ranking(sizes) {
  const dist = (c) => Math.hypot(c[2] - sizes[0], c[3] - sizes[1], c[4] - sizes[2]);
  return CHARACTERS.map((c) => ({ c, d: dist(c) })).sort((a, b) => a.d - b.d);
}

async function analyze(rawName) {
  const name = rawName.normalize("NFKC").trim();
  if (!name) throw new Error("名前を入力してください");
  // 裏技: 「バスト,ウエスト,ヒップ」を直接入力すると、ハッシュを通さずそのまま3サイズになる。
  const cheat = CHEAT_RE.exec(name);
  if (cheat) {
    const sizes = cheat.slice(1).map(Number);
    return { name, hash: null, sizes, verdict: judge(sizes), ranked: ranking(sizes) };
  }
  const bytes = await sha256Bytes(name);
  const sizes = sizesFromHash(bytes);
  return { name, hash: toHex(bytes), sizes, verdict: judge(sizes), ranked: ranking(sizes) };
}

// ---- 表示 ----
const $ = (id) => document.getElementById(id);
const SIZE_LABELS = ["バスト", "ウエスト", "ヒップ"];

// 3サイズ(0〜999)を R/G/B(0〜255)に対応させる。
const toRgb = (sizes) => sizes.map((v) => Math.round((v / MAX_SIZE) * 255));

// WCAG の相対輝度。背景色の上に載せる文字色(黒/白)の選択に使う。
function luminance([r, g, b]) {
  const lin = (c) => {
    const s = c / 255;
    return s <= 0.03928 ? s / 12.92 : ((s + 0.055) / 1.055) ** 2.4;
  };
  return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
}

// 黒文字と白文字のうち、コントラスト比が高いほうを返す。
const textColorOn = (rgb) => (luminance(rgb) > 0.179 ? "#111111" : "#ffffff");

// rgb に null を渡すと初期の白黒に戻る。rainbow が true なら虹色(美の特別演出)。
function applyTheme(rgb, rainbow = false) {
  const root = document.documentElement.style;
  document.documentElement.classList.toggle("rainbow", rainbow);
  if (!rgb) {
    ["--accent", "--on-accent", "--tint"].forEach((k) => root.removeProperty(k));
    return;
  }
  root.setProperty("--accent", `rgb(${rgb.join(",")})`);
  root.setProperty("--on-accent", textColorOn(rgb));
  root.setProperty("--tint", "14%");
}

// 共有する文面。1 行目に名前(○○さんの)を入れる。裏技の数値入力(hash が無い)のときは名前の行を省く。
function shareText(r) {
  const [b, w, h] = r.sizes;
  return [
    ...(r.hash ? [`${r.name}さんの`] : []),
    `3サイズ判定は「${r.verdict.label}」でした ${r.verdict.emoji}`,
    `バスト${b} / ウエスト${w} / ヒップ${h}`,
    `いちばん近いキャラ: ${r.ranked[0].c[1]}${r.ranked[0].c[0]}`,
    "#3サイズシミュレーター",
  ].join("\n");
}

// 判定ごとの共有ページ(r/<判定の番号>.html)。判定ごとの OGP 画像を持ち、開くと本体へ移動する。
// クローラは JavaScript を実行しないので、サムネイルを判定で変えるにはページ自体を判定ごとに用意するしかない。
const shareUrl = (verdict) => new URL(`r/${verdict.id}.html`, location.href).href;

let currentShare = { text: "", url: "" };

function setupShare(r) {
  const text = shareText(r);
  const url = shareUrl(r.verdict);
  currentShare = { text, url };
  $("share-x").href = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
  $("share-line").href = `https://line.me/R/share?text=${encodeURIComponent(text + "\n" + url)}`;
  $("share-native").hidden = !navigator.share;
  $("share-status").textContent = "";
}

function showShareStatus(message) {
  $("share-status").textContent = message;
}

async function copyText(text) {
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
  // Clipboard API が使えない環境(古いブラウザ・非セキュア接続)向けの代替。
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.append(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  if (!ok) throw new Error("copy failed");
}

$("share-copy").addEventListener("click", async () => {
  try {
    await copyText(`${currentShare.text}\n${currentShare.url}`);
    showShareStatus("コピーしました");
  } catch {
    showShareStatus("コピーできませんでした");
  }
});

$("share-native").addEventListener("click", async () => {
  try {
    await navigator.share(currentShare);
  } catch (err) {
    if (err.name !== "AbortError") showShareStatus("共有できませんでした");
  }
});

function render(r) {
  $("v-emoji").textContent = r.verdict.emoji;
  $("v-label").textContent = r.verdict.label;
  $("v-label").style.fontFamily = `"${r.verdict.font}", var(--font-body)`;
  $("v-label").classList.toggle("long", r.verdict.label.length > 3);
  $("v-reading").textContent = r.verdict.reading ? `(${r.verdict.reading})` : "";

  const rgb = toRgb(r.sizes);
  const hex = "#" + rgb.map((c) => c.toString(16).padStart(2, "0")).join("").toUpperCase();
  $("v-color").textContent = `R${rgb[0]} G${rgb[1]} B${rgb[2]}  ${hex}`;
  applyTheme(rgb, r.verdict.label === "美");

  $("sizes").replaceChildren(...r.sizes.map((v, i) => {
    const row = document.createElement("div");
    row.className = "size";
    row.innerHTML = '<span class="name"></span><div class="bar"><span></span></div><span class="val"></span>';
    row.querySelector(".name").textContent = SIZE_LABELS[i];
    row.querySelector(".bar > span").style.width = `${(v / MAX_SIZE) * 100}%`;
    row.querySelector(".val").textContent = v;
    return row;
  }));

  const [first, ...rest] = r.ranked;
  const [, , fb, fw, fh] = first.c;
  $("n-emoji").textContent = first.c[1];
  $("n-name").textContent = first.c[0];
  $("n-meta").textContent = `${fb} / ${fw} / ${fh}(距離 ${first.d.toFixed(1)})`;

  $("runner").replaceChildren(...rest.slice(0, 3).map((x) => {
    const li = document.createElement("li");
    li.textContent = `${x.c[1]} ${x.c[0]}(${x.c[2]} / ${x.c[3]} / ${x.c[4]}、距離 ${x.d.toFixed(1)})`;
    return li;
  }));

  setupShare(r);

  $("hash-box").hidden = !r.hash;
  $("hash").textContent = r.hash ?? "";
  $("result").hidden = false;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("error").textContent = "";
  try {
    const result = await analyze($("name").value);
    // 判定の書体が読み込まれてから表示する(待ちすぎないよう 1.5 秒で打ち切る)。
    await Promise.race([
      document.fonts.load(`1em "${result.verdict.font}"`, result.verdict.label).catch(() => {}),
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]);
    render(result);
  } catch (err) {
    $("result").hidden = true;
    applyTheme(null);
    $("error").textContent = err.message;
  }
});
</script>
</body>
